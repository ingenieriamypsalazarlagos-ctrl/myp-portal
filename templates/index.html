<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Asistente IA - Web</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f7fd;color:#23233a;display:flex;flex-direction:column;height:100vh}
header{background:linear-gradient(135deg,#5b5fd6,#7c7ff0);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px} header p{margin:2px 0 0;font-size:12px;opacity:.9}
.logout{background:rgba(255,255,255,0.2);color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600}
.logout:hover{background:rgba(255,255,255,0.3)}
#chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:13px}
.msg{max-width:78%;padding:12px 16px;border-radius:14px;line-height:1.55;white-space:pre-wrap;font-size:15px}
.yo{align-self:flex-end;background:#7c7ff0;color:#fff;border-bottom-right-radius:4px}
.el{align-self:flex-start;background:#fff;border:1px solid #d9daf7;border-bottom-left-radius:4px}
.pensando{align-self:flex-start;color:#8a8aa8;font-size:14px;font-style:italic}
footer{display:flex;gap:9px;padding:14px 20px;background:#fff;border-top:1px solid #d9daf7;align-items:center}
input[type=text]{flex:1;padding:13px 16px;border:1px solid #d9daf7;border-radius:10px;font-size:15px;outline:none}
input[type=text]:focus{border-color:#7c7ff0}
button{padding:12px 22px;background:#7c7ff0;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <h1>Hola, {{ username }} 👋</h1>
    <p>Tu agente virtual conectado en la nube</p>
  </div>
  <a href="{{ url_for('logout') }}" class="logout">Cerrar sesión</a>
</header>

<div id="chat">
  <div class="msg el">¡Hola! Ya iniciaste sesión correctamente. Pregúntame lo que necesites.</div>
</div>

<footer>
  <input type="text" id="txt" placeholder="Escribe tu consulta..." autocomplete="off">
  <button id="btn" onclick="enviar()">Enviar</button>
</footer>

<script>
const chat = document.getElementById('chat'), txt = document.getElementById('txt'), btn = document.getElementById('btn');

function add(cls, t) {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = t;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
}

async function enviar() {
    const q = txt.value.trim(); 
    if (!q) return;
    
    add('msg yo', q); 
    txt.value = ''; 
    btn.disabled = true;
    
    const p = add('pensando', 'pensando...');
    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: q })
        });
        const data = await res.json();
        p.remove();
        add('msg el', data.response);
    } catch (e) {
        p.remove();
        add('msg el', 'Ocurrió un error de conexión.');
    }
    btn.disabled = false;
    txt.focus();
}

txt.onkeydown = e => { if (e.key === 'Enter') enviar(); };
txt.focus();
</script>
</body>
</html>

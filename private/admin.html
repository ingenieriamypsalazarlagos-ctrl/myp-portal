<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Ingeniería MyP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #070a13; color: #f8fafc; font-family: sans-serif; padding: 2rem; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 2rem; }
        .btn-logout { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="header">
        <h2>Panel de Control Interno (Administración MyP)</h2>
        <a href="/logout" class="btn-logout"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</a>
    </div>
    
    <div class="card">
        <h3>Bienvenido, Administrador</h3>
        <p style="color:#94a3b8; margin-top:0.5rem;">Esta área está protegida por el servidor. Solo tú y Paola pueden ver este contenido confidencial.</p>
    </div>
</body>
</html>

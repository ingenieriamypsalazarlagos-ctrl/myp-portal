<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingeniería MVP Salazar Lagos - Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #38bdf8;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
        }
        nav a:hover {
            color: #ffffff;
        }
        .btn-acceso {
            background-color: #f97316;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-acceso:hover {
            background-color: #ea580c;
        }
        .main-container {
            width: 100%;
            min-height: 85vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Contenedor del Iframe con tu app de Mufas */
        .iframe-container {
            width: 100%;
            max-width: 1100px;
            height: 850px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación Superior -->
    <header>
        <div class="logo">INGENIERÍA MVP SALAZAR LAGOS</div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Quiénes Somos</a>
            <a href="#">Precios y Planes</a>
            <a href="#">Solicitudes</a>
        </nav>
        <a href="#portal-clientes" class="btn-acceso">Acceso Clientes</a>
    </header>

    <!-- Contenido Principal / Sección de la App de Mufas -->
    <div id="portal-clientes" class="main-container">
        <div class="iframe-container">
            <!-- Iframe conectado a tu GitHub Pages -->
            <iframe src="https://ingenieriamypsalazarlagos-ctrl.github.io/myp-portal/"></iframe>
        </div>
    </div>

</body>
</html>

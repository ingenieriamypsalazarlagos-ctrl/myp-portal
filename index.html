<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catastro Mufa TP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Pantalla de Login de Técnicos */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .login-box h3 { margin-top: 0; color: #333; }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .login-box button:hover { background-color: #1d4ed8; }
        .login-error { color: #dc2626; font-size: 12px; margin-top: 5px; display: none; }

        h2 { color: #333; text-align: center; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #666; text-align: center; margin-bottom: 20px; }
        .container {
            width: 100%;
            max-width: 750px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .plano-control-bar {
            background: #212529;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .plano-status { font-size: 14px; font-weight: bold; }
        .info-trabajo-header {
            background: #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #333;
            display: none;
        }
        .grupo-botones-plano { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-plano {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-iniciar { background-color: #28a745; color: white; }
        .btn-cerrar { background-color: #dc3545; color: white; }
        .btn-excel { background-color: #17a2b8; color: white; }
        .btn-visual { background-color: #6f42c1; color: white; }

        .top-mufa-controls { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .btn-add-mufa {
            background-color: #0ea5e9; color: white; border: none;
            padding: 8px 14px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .mufa-section {
            background: #f8f9fa; border: 2px solid #cbd5e1; border-radius: 6px; margin-bottom: 20px; padding: 15px;
        }
        .mufa-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #475569; color: white; padding: 8px 12px; border-radius: 4px; font-weight: bold; margin-bottom: 10px;
        }
        .btn-principal {
            background-color: #007bff; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .cable-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; margin: 10px 0; padding: 10px; }
        .cable-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #334155; color: white; padding: 8px 10px; border-radius: 4px; font-size: 14px;
        }
        .cable-info { text-align: right; font-size: 12px; }
        .botones-cable { margin-top: 4px; }
        .btn-editar-cable { background: #0ea5e9; color: white; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; margin-right: 4px; }
        .btn-eliminar-cable { background: #eab308; color: #000; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .filamentos-container { margin-top: 8px; padding-left: 8px; border-left: 3px solid #334155; max-height: 200px; overflow-y: auto; }
        .filamento-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dashed #e2e8f0; font-size: 12px; }
        .btn-fusionar { background: #16a34a; color: white; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-liberar { background: #dc2626; color: white; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 4px; }
        .resumen { margin-top: 25px; padding-top: 15px; border-top: 1px solid #cbd5e1; }
        .resumen h3 { font-size: 16px; color: #333; }
        ul { padding-left: 20px; }
        li { margin-bottom: 5px; color: #475569; font-size: 12px; }
        .bloqueado { opacity: 0.6; pointer-events: none; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-top: 0; font-size: 16px; color: #333; }
        .modal-content label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-top: 10px; }
        .modal-content select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
        .modal-buttons { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }
        .modal-buttons button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }

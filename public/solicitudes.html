<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes - Ingeniería MyP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-dark: #0f172a; --surface-card: #1e293b; --accent-cyan: #06b6d4; 
            --accent-blue: #3b82f6; --text-main: #f1f5f9; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
        
        .form-container { background: var(--surface-card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .form-header { text-align: center; margin-bottom: 2rem; }
        .form-header h2 { font-size: 1.8rem; color: #fff; margin-bottom: 0.5rem; }
        .form-header p { color: var(--text-muted); font-size: 0.9rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; }
        .form-control { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem 1rem; color: #fff; font-size: 1rem; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(6,182,212,0.2); }
        textarea.form-control { resize: vertical; min-height: 120px; }

        .btn-enviar { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #fff; width: 100%; padding: 0.9rem; border-radius: 8px; font-weight: bold; font-size: 1rem; border: none; cursor: pointer; transition: 0.3s; margin-top: 1rem; }
        .btn-enviar:hover { opacity: 0.9; }

        #mensaje-alerta { margin-top: 1rem; text-align: center; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Bandeja de Solicitudes</h2>
            <p>Envíanos tus requerimientos, dudas o propuestas y te responderemos a la brevedad.</p>
        </div>

        <form id="form-solicitud">
            <div class="form-group">
                <label>Nombre o Empresa</label>
                <input type="text" name="nombre" class="form-control" required placeholder="Tu nombre o empresa">
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="email" class="form-control" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label>Teléfono / WhatsApp</label>
                <input type="tel" name="telefono" class="form-control" required placeholder="+569...">
            </div>

            <div class="form-group">
                <label>Detalle de la Solicitud</label>
                <textarea name="mensaje" class="form-control" required placeholder="Cuéntanos qué necesitas..."></textarea>
            </div>

            <button type="submit" class="btn-enviar" id="btn-submit">
                <i class="fa-solid fa-paper-plane"></i> Enviar Solicitud
            </button>
            
            <div id="mensaje-alerta"></div>
        </form>
    </div>

    <script>
        const URL_WEBHOOK_PRODUCCION = "https://mauriciogabriel.app.n8n.cloud/webhook/99f7f370-110c-41cf-9aca-790688566092";

        document.getElementById('form-solicitud').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            const alerta = document.getElementById('mensaje-alerta');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
            alerta.textContent = '';

            const formData = {
                nombre: this.nombre.value,
                email: this.email.value,
                telefono: this.telefono.value,
                mensaje: this.mensaje.value
            };

            try {
                const response = await fetch(URL_WEBHOOK_PRODUCCION, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alerta.style.color = 'var(--accent-cyan)';
                    alerta.textContent = '¡Solicitud enviada con éxito!';
                    this.reset();
                } else {
                    throw new Error('Error en el servidor');
                }
            } catch (error) {
                alerta.style.color = '#ef4444';
                alerta.textContent = 'Hubo un error al enviar. Inténtalo de nuevo.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Solicitud';
            }
        });
    </script>
</body>
</html>
